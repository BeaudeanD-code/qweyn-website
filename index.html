<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qweyn | Luxury Logistics</title>
    <style>
        :root {
            --navy: #0F2238;
            --gold: #C8A86B;
            --forest: #2E4A38;
            --brown: #6B5442;
            --cream: #FDFCF0;
        }

        body {
            background-color: var(--navy);
            color: var(--cream);
            font-family: 'Times New Roman', serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            border: 1px solid var(--gold);
            padding: 4rem 2rem;
            max-width: 600px;
            margin: 20px;
            position: relative;
        }

        /* This is a placeholder for your logo */
        .logo-placeholder {
            max-width: 200px;
            margin-bottom: 20px;
            color: var(--gold);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        h1 {
            color: var(--gold);
            letter-spacing: 8px;
            text-transform: uppercase;
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--cream);
            opacity: 0.8;
            max-width: 450px;
            margin: 0 auto;
        }

        .accent {
            height: 1px;
            width: 80px;
            background-color: var(--gold);
            margin: 30px auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- We will replace this text with your <img src="logo.png"> later -->
        <div class="logo-placeholder">[ LOGO COMING SOON ]</div>
        
        <h1>QWEYN</h1>
        <div class="accent"></div>
        <p>Connecting the United States and Myanmar through premier logistics and luxury transport.</p>
        <p style="margin-top: 20px; color: var(--gold); font-style: italic; font-size: 0.9rem;">
            Site Under Construction
        </p>
    </div>

</body>
</html>
